[config]

[templates.cava]
input_path = "./templates/cava-colors.ini"
output_path = '~/.config/cava/themes/matugen-colors'
post_hook = 'pkill -USR1 cava'

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = '~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh'

[templates.hyprland]
input_path = './templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.kvantum_kvconfig]
input_path = './templates/kvantum-colors.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = './templates/kvantum-colors.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'

[templates.nvim]
input_path = './templates/nvim-colors.lua'
output_path = '~/.config/nvim/matugen.lua'
post_hook = 'pkill -SIGUSR1 nvim'
index = 1

[templates.papirus-folders]
input_path = './templates/papirus-color'
colors_to_compare = [
    { name = "black",      color = "#4f4f4f" },
    { name = "blue",       color = "#5294e2" },
    { name = "bluegrey",   color = "#607d8b" },
    { name = "brown",      color = "#ae8e6c" },
    { name = "carmine",    color = "#a30002" },
    { name = "cyan",       color = "#00bcd4" },
    { name = "darkcyan",   color = "#45abb7" },
    { name = "deeporange", color = "#eb6637" },
    { name = "green",      color = "#87b158" },
    { name = "grey",       color = "#8e8e8e" },
    { name = "indigo",     color = "#5c6bc0" },
    { name = "magenta",    color = "#ca71df" },
    { name = "nordic",     color = "#81a1c1" },
    { name = "orange",     color = "#ee923a" },
    { name = "palebrown",  color = "#d1bfae" },
    { name = "paleorange", color = "#eeca8f" },
    { name = "pink",       color = "#f06292" },
    { name = "red",        color = "#e25252" },
    { name = "teal",       color = "#16a085" },
    { name = "violet",     color = "#7e57c2" },
    { name = "white",      color = "#e4e4e4" },
    { name = "yaru",       color = "#676767" },
    { name = "yellow",     color = "#f9bd30" },
]
compare_to = "{{ colors.primary.default.hex }}"
post_hook = 'sudo -n papirus-folders -C {{ closest_color }} -u'
index = 1

[templates.quickshell]
input_path = './templates/quickshell.json'
output_path = '~/.local/state/quickshell/generated/colors.json'

[templates.qt5ct]
input_path = './templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = './templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.superfile]
input_path = './templates/superfile.toml'
output_path = '~/.config/superfile/theme/matugen.toml'

[templates.terminal]
input_path  = './templates/terminal.sh'
output_path = '~/.cache/matugen/terminal.sh'

[templates.user_chrome]
pre_hook = '~/.config/matugen/pre-hook-scripts/userChrome.sh'
input_path = './templates/userChrome.css'
output_path = '~/.cache/matugen/userChrome.css'
post_hook = '~/.config/matugen/post-hook-scripts/userChrome.sh'

[templates.user_content]
pre_hook = '~/.config/matugen/pre-hook-scripts/userContent.sh'
input_path = './templates/userContent.css'
output_path = '~/.cache/matugen/userContent.css'
post_hook = '~/.config/matugen/post-hook-scripts/userContent.sh'

[templates.variables]
input_path  = './templates/variables.sh'
output_path = '~/.cache/matugen/variables.sh'

[templates.vesktop]
input_path = './templates/midnight-discord.css'
output_path = '~/.config/vesktop/themes/midnight-discord.css'

[templates.yazi]
input_path = './templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.zen-wabi]
input_path = './templates/matugen-vars.json'
output_path = '~/.cache/matugen/matugen-vars.json'
post_hook = '~/.config/matugen/post-hook-scripts/zen-wabi.sh'
index = 1

