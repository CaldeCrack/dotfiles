# Cava configuration for the QuickShell music tab's audio visualizer.
#
# Checked into the project and hand-edited rather than generated at
# runtime — a settings-UI panel to tweak these values (bar count,
# sensitivity, etc.) without touching this file directly is a reasonable
# future addition, not something this file or CavaService.qml try to
# anticipate right now.

[general]
bars = 32
framerate = 60
autosens = 1
sensitivity = 100

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 255
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 60
